services:
  - type: web
    name: greenville-roleplay-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DEFAULT_PREFIX
        value: "-"
      - key: DATABASE_PATH
        value: "data/bot.db"
      - key: GUILD_ID
        value: "0"